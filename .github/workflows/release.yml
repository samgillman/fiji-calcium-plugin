name: Publish release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build versioned release assets
        run: python tools/build_release.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag must match VERSION ($tag)" >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/Calcium_Imaging_Fiji_Plugin.zip \
            dist/Calcium_Cells_Step_By_Step.groovy \
            dist/VERSION.txt dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Fiji Calcium Plugin $version" \
            --notes-file dist/release-notes.md --draft
          gh release edit "$tag" --draft=false --latest
